packages:
  - 'packages/*'
catalog:
  '@angular/cli': '22.1.4'
  '@angular/compiler': '22.1.3'
  '@commitlint/cli': '21.2.2'
  '@commitlint/config-conventional': '21.2.2'
  '@eslint/core': '1.2.1'
  '@eslint/js': '10.0.1'
  '@mdn/browser-compat-data': '8.0.11'
  '@nx/devkit': '23.1.1'
  '@nx/esbuild': '23.1.1'
  '@nx/eslint': '23.1.1'
  '@nx/eslint-plugin': '23.1.1'
  '@nx/js': '23.1.1'
  '@nx/plugin': '23.1.1'
  '@nx/vite': '23.1.1'
  '@nx/vitest': '23.1.1'
  '@nx/workspace': '23.1.1'
  '@schematics/angular': '22.1.4'
  '@swc-node/register': '1.11.1'
  '@swc/cli': '0.8.1'
  '@swc/core': '1.15.43'
  '@swc/helpers': '0.5.23'
  '@types/aria-query': '5.0.4'
  '@types/node': '25.9.5'
  '@types/semver': '^7.5.8'
  '@types/yargs': '^17.0.33'
  '@vitest/coverage-v8': '4.1.11'
  cz-conventional-changelog: '3.3.0'
  esbuild: '^0.28.0'
  eslint: '10.8.1'
  eslint-config-prettier: '10.1.5'
  execa: '5.1.1'
  husky: '9.1.7'
  json-schema-to-typescript: '15.0.4'
  json-schema-traverse: '1.0.0'
  jsonc-eslint-parser: '2.4.2'
  lint-staged: '17.3.0'
  ncp: '2.0.0'
  nx: '23.1.1'
  picocolors: '1.1.1'
  pkg-pr-new: '0.0.88'
  prettier: '3.9.6'
  tree-kill: '1.2.2'
  ts-node: '10.9.2'
  tslib: '^2.4.1'
  tsx: '4.23.12'
  typescript: '6.0.3'
  verdaccio: '6.9.2'
  vite: '^8.0.0'
  vitest: '4.1.11'
  yargs: '18.1.0'
catalogMode: 'prefer'
catalogs:
  other-runtime-dependencies:
    '@angular/cli': '>= 22.0.0 < 23.0.0'
    '@angular-devkit/architect': '>= 0.2200.0 < 0.2300.0'
    '@angular-devkit/core': '>= 22.0.0 < 23.0.0'
    '@angular-devkit/schematics': '>= 22.0.0 < 23.0.0'
    aria-query: '5.3.2'
    axobject-query: '4.1.0'
    eslint-scope: '9.1.2'
    ignore: '7.0.6'
    semver: '7.8.5'
    strip-json-comments: '3.1.1'
    ts-api-utils: '^2.1.0'
  typescript-eslint:
    '@typescript-eslint/rule-tester': '8.67.0'
    '@typescript-eslint/types': '8.67.0'
    '@typescript-eslint/utils': '8.67.0'
    typescript-eslint: '8.67.0'
cleanupUnusedCatalogs: true
# TODO: Remove this
# pnpm 11 enforces a default minimumReleaseAge of 1440 minutes (1 day). This
# version of @types/node was published <24h before our CI install, so it trips
# the supply-chain gate. Scoped exception (exact version) so it self-expires on
# the next bump and forces re-evaluation.
minimumReleaseAgeExclude:
  - '@types/node@25.9.2'
allowBuilds:
  '@swc/core': true
  core-js: false
  esbuild: true
  nx: true
  unrs-resolver: true
patchedDependencies:
  '@typescript-eslint/rule-tester': 'tools/patches/@typescript-eslint__rule-tester.patch'
