packages:
  - 'packages/*'
catalog:
  '@angular/cli': '22.2.7'
  '@angular/compiler': '22.2.6'
  '@commitlint/cli': '21.2.4'
  '@commitlint/config-conventional': '21.2.4'
  '@eslint/core': '1.2.1'
  '@eslint/js': '10.0.1'
  '@mdn/browser-compat-data': '8.1.9'
  '@nx/devkit': '24.0.6'
  '@nx/esbuild': '24.0.6'
  '@nx/eslint': '24.0.6'
  '@nx/eslint-plugin': '24.0.6'
  '@nx/js': '24.0.6'
  '@nx/plugin': '24.0.6'
  '@nx/vite': '24.0.6'
  '@nx/vitest': '24.0.6'
  '@nx/workspace': '24.0.6'
  '@schematics/angular': '22.2.7'
  '@swc-node/register': '1.12.1'
  '@swc/core': '1.16.22'
  '@swc/helpers': '0.5.24'
  '@types/aria-query': '5.0.4'
  '@types/node': '26.6.6'
  '@types/semver': '^7.5.8'
  '@types/yargs': '^17.0.33'
  '@vitest/coverage-v8': '5.1.1'
  cz-conventional-changelog: '3.3.0'
  esbuild: '^0.28.0'
  eslint: '10.15.0'
  eslint-config-prettier: '10.1.5'
  execa: '5.1.1'
  husky: '9.1.7'
  json-schema-to-typescript: '16.0.0'
  json-schema-traverse: '1.0.0'
  jsonc-eslint-parser: '2.4.2'
  lint-staged: '17.6.1'
  ncp: '2.0.0'
  nx: '24.0.6'
  picocolors: '1.1.1'
  pkg-pr-new: '0.0.94'
  prettier: '3.10.1'
  tree-kill: '1.2.2'
  ts-node: '10.9.2'
  tslib: '^2.4.1'
  tsx: '4.23.15'
  typescript: '6.0.3'
  verdaccio: '6.11.2'
  vite: '^8.0.0'
  vitest: '5.1.1'
  yargs: '18.2.0'
catalogMode: 'prefer'
catalogs:
  other-runtime-dependencies:
    '@angular/cli': '>= 22.0.0 < 23.0.0'
    '@angular-devkit/architect': '>= 0.2200.0 < 0.2300.0'
    '@angular-devkit/core': '>= 22.0.0 < 23.0.0'
    '@angular-devkit/schematics': '>= 22.0.0 < 23.0.0'
    aria-query: '5.3.2'
    axobject-query: '4.1.0'
    eslint-scope: '9.1.2'
    ignore: '7.0.16'
    semver: '7.8.6'
    strip-json-comments: '3.1.1'
    ts-api-utils: '^2.1.0'
  typescript-eslint:
    '@typescript-eslint/rule-tester': '8.73.0'
    '@typescript-eslint/types': '8.73.0'
    '@typescript-eslint/utils': '8.73.0'
    typescript-eslint: '8.73.0'
cleanupUnusedCatalogs: true
# Only resolve package versions that have been published for at least 7 days
# (10080 minutes), as a precaution against malicious publishes. This matches
# the minimumReleaseAge in .github/renovate.json, so that transitive versions
# resolved into the lockfile get the same protection as the updates Renovate
# proposes. Keep the two in sync, including any exceptions.
minimumReleaseAge: 10080
allowBuilds:
  '@swc/core': true
  core-js: false
  esbuild: true
  nx: true
  unrs-resolver: true
patchedDependencies:
  '@typescript-eslint/rule-tester': 'tools/patches/@typescript-eslint__rule-tester.patch'
